<title id="title">LED matrix message — USB connection</title><desc id="desc">Computer connects by a USB data cable to the USB-C port on the Arduino UNO R4 WiFi. The built-in 12 by 8 LED matrix displays scrolling text. No external circuit is needed.</desc>
