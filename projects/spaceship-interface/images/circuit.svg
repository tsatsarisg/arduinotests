<title id="title">Spaceship Interface — proposed circuit</title><desc id="desc">UNO R4 WiFi: D3, D4 and D5 each feed a 1 kilohm resistor and LED to ground. D2 reads a normally open button connected to 5V, with a 10 kilohm pull-down to ground. Planned wiring; LED behavior is not implemented yet.</desc>
